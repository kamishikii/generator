name: APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Сборка Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Сборка веб-части
        run: npm run build

      - name: Генерация Android-проекта
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Синхронизация Capacitor
        run: npx cap sync android

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Настройка памяти Gradle
        run: |
          printf '\norg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8\norg.gradle.parallel=true\n' >> android/gradle.properties

      - name: Сборка debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Подготовка артефакта
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/drevo-r${{ github.run_number }}.apk"
          ls -lh out

      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: drevo-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Загрузка веб-сборки
        uses: actions/upload-artifact@v4
        with:
          name: drevo-web
          path: dist
          retention-days: 14
