<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1411">
<title>ДРЕВО · редактор мира</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M16 29V15" stroke="#9ef01a" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M16 20l-6-5M16 17l6-5" stroke="#2fbf6a" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M16 15c-5 0-8-3.4-8-7 0-3 2.6-5.4 5.4-4.6C14 1.7 16.6 1 18.6 2.4c3-1 5.4 1.6 5.4 4.6 0 4-3.6 8-8 8z" fill="rgba(47,191,106,.28)" stroke="#9ef01a" stroke-width="1.6"/>
        <circle cx="25.5" cy="6.5" r="2.6" fill="#ffb020"/>
      </svg>
      <div><h1>ДРЕВО</h1><small id="modeTag">world</small></div>
    </div>
    <div class="counter">
      <div class="tris"><b id="triNum">0</b><span id="triLabel">треугольников</span></div>
      <button class="iconbtn on" id="soundBtn" aria-pressed="true"><i class="dot"></i><span class="txt">ЗВУК</span></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="ov chip" id="infoChip">мир · seed <b id="seedName">1337</b> · <b id="cntChip">4</b></div>
    <div class="ov chip" id="growChip"><i class="spin"></i><span id="growText">рост…</span><b id="growPct"></b></div>
    <div class="ov chip" id="selChip"><span id="selText">объект</span>
      <button class="mini" id="selRotL">⟲</button><button class="mini" id="selRotR">⟳</button>
      <button class="mini" id="selSm">−</button><button class="mini" id="selBg">+</button>
      <button class="mini" id="selAll">ко всем</button><button class="mini" id="selDup">дубль</button>
      <button class="mini danger" id="selDel">удалить</button><button class="mini" id="selNone">снять</button>
    </div>

    <div class="stage-tools">
      <button class="toolbtn hot" id="btnViewer" title="Полный экран">⤢</button>
      <button class="toolbtn" id="btnCam" title="Сброс камеры">⟲</button>
      <button class="toolbtn" id="btnWire" title="Каркас">◈</button>
      <button class="toolbtn" id="btnDice2" title="Перегенерировать">⚄</button>
    </div>

    <div id="toolRail"></div>
    <div id="brushBar"></div>
    <div id="modeBtns">
      <button class="mbtn" id="btnEdit"><b>РЕДАКТОР</b><span>кисти по земле</span></button>
      <button class="mbtn" id="btnClean"><b>ПРОСМОТР</b><span>скрыть всё</span></button>
    </div>

    <section class="ov panel" id="hud">
      <button class="hudhead" id="hudToggle" aria-expanded="true">
        <span class="ttl">телеметрия</span><span class="mini2" id="hudMini">—</span><i class="chev">▾</i>
      </button>
      <div class="hudbody">
        <div class="row"><span>FPS</span><b id="mFps">—</b></div>
        <div class="row"><span>кадр</span><b id="mMs">—</b></div>
        <div class="row"><span>трис сцены</span><b id="mTris">—</b></div>
        <div class="row opt"><span>draw calls</span><b id="mCalls">—</b></div>
        <div class="sep"></div>
        <div class="row"><span id="lA">деревьев</span><b id="mA">—</b></div>
        <div class="row"><span id="lB">узлов</span><b id="mB">—</b></div>
        <div class="row"><span id="lC">листьев</span><b id="mC">—</b></div>
        <div class="row"><span id="lD">травы</span><b id="mD">—</b></div>
        <div class="row opt"><span id="lE">вода</span><b id="mE">—</b></div>
        <div class="row opt"><span>генерация</span><b id="mGen">—</b></div>
        <div class="sep"></div>
        <div class="row"><span>кисть</span><b id="mBrush">—</b></div>
        <div class="gust" id="gust"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </section>

    <div class="ov" id="hint"><div class="chip"><span id="hintText">РЕДАКТОР — кисти по земле</span></div></div>
    <div class="ov" id="toast"></div>
    <div id="dock"></div>
    <button id="cleanExit" title="Вернуть интерфейс">◱</button>

    <div id="boot"><div>
      <svg width="104" height="104" viewBox="0 0 120 120" fill="none">
        <path class="dash" d="M60 112V60M60 78l-20-16M60 70l20-16M60 60c-16 0-26-11-26-23 0-10 9-18 18-15 4-6 12-8 18-3 10-3 18 5 18 15 0 13-12 26-28 26z" stroke="#9ef01a" stroke-width="2.4" stroke-linecap="round"/>
      </svg><p>инициализация</p></div></div>
    <div id="fallback"><div><canvas id="fbCanvas" width="520" height="360"></canvas><p id="fbMsg"></p></div></div>
  </main>

  <aside class="rail" id="rail">
    <div class="quick" id="quick"></div>
    <div class="panes" id="panes"></div>
    <div class="actions" id="actions"></div>
    <nav class="tabbar" id="tabbar">
      <button class="tab on" data-tab="world"><b>МИР</b><span>ландшафт</span></button>
      <button class="tab" data-tab="human"><b>МОДЕЛИ</b><span>человек</span></button>
      <button class="tab" data-tab="arch"><b>АРХИТЕКТУРА</b><span>здания</span></button>
    </nav>
  </aside>
</div>

<script>
/* ФИКС ПАДЕНИЯ: main.js в конце boot() пишет "water = { mesh: null }",
   но переменная water нигде не объявлена -> в модуле (strict mode) это
   ReferenceError и всё приложение умирает. Объявляем её заранее глобально,
   тогда присваивание проходит и boot() доезжает до конца. */
var water = null;
</script>
<script>
/* страховка: любая ошибка теперь видна на экране красной плашкой */
function showErr(t){var d=document.getElementById('errbox');if(!d){d=document.createElement('pre');d.id='errbox';d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#500;color:#fff;font:12px/1.4 monospace;padding:10px;border-radius:8px;max-height:45vh;overflow:auto;white-space:pre-wrap';document.body.appendChild(d);}d.textContent=t;}
window.addEventListener('error',function(e){showErr(e.message+'\n'+(e.error&&e.error.stack||''));});
window.addEventListener('unhandledrejection',function(e){showErr('Promise: '+(e.reason&&e.reason.message||e.reason));});
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
